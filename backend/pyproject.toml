[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kisan-saathi-backend"
version = "0.1.0"
description = "Hindi-first AI farming advisor backend (hackathon scaffold)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "motor>=3.5,<4",
  "pymongo>=4.8,<5",
  "google-cloud-storage>=2.18,<3",
  "google-cloud-aiplatform>=1.60,<2",
  "google-cloud-speech>=2.26,<3",
  "google-cloud-texttospeech>=2.20,<3",
  "langgraph>=0.2.30,<0.3",
  "langchain>=0.3,<0.4",
  "langchain-google-vertexai>=2.0,<3",
  "langchain-mongodb>=0.2,<1",
  "langchain-text-splitters>=0.3,<1",
  "earthengine-api>=0.1.400,<2",
  "pypdf>=5.0,<6",
  "pillow>=10.4,<12",
  "reportlab>=4.2,<5",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5.0,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]
